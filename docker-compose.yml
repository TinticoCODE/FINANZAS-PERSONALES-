services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-finance-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance123
      POSTGRES_DB: personal_finance
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
